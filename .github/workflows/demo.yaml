# Install the package and run the demonstration and the preprocessing example
# on every change, then compare every workbook sheet, Run_Summary.txt and the
# figures with demo/output.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

name: demo

permissions: read-all

jobs:
  demo:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - name: Assemble the R package
        run: Rscript .github/scripts/package.R .package
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: .package
          needs: check
      - name: Install the assembled package
        run: R CMD INSTALL .package
      - name: Run the demonstration
        run: Rscript demo/run.R
      - name: Check the two local input options
        run: Rscript .github/scripts/check_input_options.R
      - name: Compare the demo output with demo/output
        run: Rscript .github/scripts/compare_output.R
      - uses: actions/upload-artifact@v4
        with:
          name: demo-output
          path: output
