# Install the package and run the demonstration and the preprocessing example
# on every change, then compare every workbook sheet, README.txt and the
# figures with demo/results.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

name: demo

permissions: read-all

jobs:
  demo:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: src
          extra-packages: local::.
          needs: check
      - name: Run the demonstration
        run: Rscript demo/run.R
      - name: Check the two local input options
        run: Rscript docs/verification/check_input_options.R
      - name: Compare the demo output with demo/results
        run: Rscript docs/verification/compare_output.R
      - uses: actions/upload-artifact@v4
        with:
          name: demo-output
          path: results
