# Package checks on Windows, macOS and Linux, plus the installed setup window,
# the demo and the reference comparison.
# Pushes and pull requests run both jobs; manual runs retain demo-only behavior.
name: Software checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  R-CMD-check:
    # Preserve the existing demo-only manual trigger.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest, r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'release'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
      - name: Assemble the R package
        run: Rscript software/setup/install.R .package
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: .package
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: .package
          upload-snapshots: true
          build_args: 'c("--no-manual")'

  demo:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - name: Assemble the R package
        run: Rscript software/setup/install.R .package
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: .package
          extra-packages: any::remotes
          needs: check
      - name: Check that a release names one version everywhere
        run: Rscript software/setup/maintenance.R check-release
      - name: Install with the README call and drive the window it opens in Chromium
        shell: bash
        run: |
          export SCORCH_UI_PROJECT="$(mktemp -d)"
          export SCORCH_UI_DATA="$PWD/demo/input/north_america_processed_tmax.nc"
          export SCORCH_UI_SHOTS="$RUNNER_TEMP/scorch-window"
          export CHROME_BIN="$(command -v google-chrome)"
          mkdir -p "$SCORCH_UI_SHOTS"
          zip -q -j "$SCORCH_UI_PROJECT/temperatures.zip" "$SCORCH_UI_DATA"
          npm install --prefix "$RUNNER_TEMP/scorch-browser" --no-audit --no-fund playwright-core@1.55.0
          export NODE_PATH="$RUNNER_TEMP/scorch-browser/node_modules"
          log="$RUNNER_TEMP/scorch-window.log"
          # The last two lines of the README block, from this checkout: install, then the window opens.
          echo 'setwd(Sys.getenv("SCORCH_UI_PROJECT")); options(shiny.port=7123L, shinygadgets.showdialog=function(...) NULL); stopifnot(interactive(), !requireNamespace("scoRch.simulator", quietly = TRUE)); source(file.path(Sys.getenv("GITHUB_WORKSPACE"), "software/setup/install.R")); install_scorch(path = Sys.getenv("GITHUB_WORKSPACE"))' |
            R --vanilla --interactive > "$log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          curl -fsS --retry 90 --retry-delay 2 --retry-all-errors http://127.0.0.1:7123/ -o /dev/null || { cat "$log"; exit 1; }
          node software/tests/browser/guided.cjs || { cat "$log"; exit 1; }
          wait "$server" || true
          cat "$log"
          grep -Eq "^Installed scoRch.simulator [0-9.]+\.$" "$log"
          grep -q "You do not need to run the installation block again" "$log"
          grep -q "Nothing is analyzed until you click Run analysis" "$log"
          grep -q "To open it again, run scoRch.simulator::run_scorch()" "$log"
      - name: Running the block again neither downloads nor reinstalls
        run: |
          source("software/setup/install.R")
          version <- as.character(utils::packageVersion("scoRch.simulator"))
          before <- file.mtime(system.file("DESCRIPTION", package = "scoRch.simulator"))
          said <- utils::capture.output(install_scorch(ref = paste0("v", version), open = FALSE), type = "message")
          writeLines(said)
          stopifnot(any(grepl("is already installed. Nothing was downloaded or changed.", said, fixed = TRUE)),
                    any(grepl("scoRch.simulator::run_scorch()", said, fixed = TRUE)),
                    identical(before, file.mtime(system.file("DESCRIPTION", package = "scoRch.simulator"))))
        shell: Rscript {0}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: setup-window
          path: ${{ runner.temp }}/scorch-window
      - name: Run the demonstration
        run: Rscript demo/run.R
      - name: Compare the demo output with demo/output
        run: Rscript software/setup/maintenance.R compare
      - uses: actions/upload-artifact@v4
        with:
          name: demo-output
          path: output
