# Full US demonstration: every April-September hour, 1996-2025.
# Supply the extracted hourly-only folder locally. Downloading is separate.
input:
  file: 'demo/data/hourly'
  format: era5
  era5_cell_size_deg: 1
  processed_file: 'results/hourly/prepared_tmax.nc'
output:
  directory: 'results/hourly'
period:
  warm_season_months: [4, 5, 6, 7, 8, 9]
  start_date: '1996-04-01'
  end_date: '2025-09-30'
figures:
  representative_events:
    type_3: ["2012-06-28", "2023-08-04"]
